name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ==================== 代码质量检查 ====================
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint

      - name: TypeScript 类型检查
        run: |
          cd server && npm run typecheck
          cd ../client && npm run typecheck

  # ==================== 单元测试 ====================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行服务端测试
        run: |
          cd server
          npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: 运行前端测试
        run: |
          cd client
          npm run test

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            server/coverage
            client/coverage

  # ==================== Supabase 数据库迁移 ====================
  migrate:
    name: 数据库迁移
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Supabase CLI
        uses: supabase/setup-cli@v1

      - name: 链接 Supabase 项目
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 执行数据库迁移
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ==================== 部署 ====================
  deploy:
    name: 部署上线
    runs-on: ubuntu-latest
    needs: migrate
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: 触发部署
        run: echo "部署步骤 - 根据实际部署方式配置"
        # 示例: 部署到 Vercel/阿里云/自建服务器
