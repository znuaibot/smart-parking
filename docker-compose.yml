# docker-compose.yml - 本地开发与测试环境
# 使用外部 Redis，仅本地启动 PostgreSQL 和 MinIO
# 一键启动: docker compose up -d

version: '3.8'

services:
  # ==================== API 服务 ====================
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: parking-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # 使用外部 Redis
      - REDIS_URL=redis://:ipaking@545@host.docker.internal:6399
      # 使用外部 Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-smart-parking-jwt-secret-2024-dev-only}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server/src:/app/src
    restart: unless-stopped
    networks:
      - parking-network

  # ==================== PostgreSQL (本地开发可选) ====================
  # 生产环境使用 Supabase，本地开发可选择性启动本地 PG
  postgres:
    image: postgres:15-alpine
    container_name: parking-postgres
    profiles:
      - local-db  # 仅当指定 profile 时启动: docker compose --profile local-db up -d
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parking-network

  # ==================== Nginx (反向代理 + 静态资源) ====================
  nginx:
    image: nginx:alpine
    container_name: parking-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - parking-network

# ==================== 网络 ====================
networks:
  parking-network:
    driver: bridge

# ==================== 卷 ====================
volumes:
  postgres-data:
